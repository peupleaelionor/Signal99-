<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <title>SIGNAL99 — Offline</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 120% at 50% 0%, #14213d 0%, #050505 55%);
        color: #f5f0e8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 32px;
      }
      .wrap { max-width: 360px; }
      .mark {
        font-size: 13px;
        letter-spacing: 0.32em;
        color: #d8b46a;
        text-transform: uppercase;
        margin-bottom: 28px;
      }
      h1 { font-size: 26px; line-height: 1.2; margin: 0 0 14px; font-weight: 600; }
      p { color: #a8a095; font-size: 15px; line-height: 1.6; margin: 0 0 28px; }
      a {
        display: inline-block;
        padding: 14px 26px;
        border-radius: 999px;
        background: linear-gradient(135deg, #d8b46a, #c17d3c);
        color: #050505;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark">SIGNAL99</div>
      <h1>Your Signal is waiting.</h1>
      <p>You’re offline right now. Your energy speaks before you do — reconnect to reveal your card.</p>
      <a href="/">Try again</a>
    </div>
  </body>
</html>
